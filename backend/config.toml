# Stained Glass Odyssey: Endless - LRM reference template
# This file is a reference only. Runtime configuration is persisted in the
# backend options store and managed via /config/lrm endpoints.

[lrm]
provider = "disabled"              # disabled | codex_cli
model = "openai/gpt-oss-120b"
reasoning_effort = "high"          # none | minimal | low | medium | high
summary = "detailed"               # auto | concise | detailed

[lrm.codex_cli]
# Optional timeout override for Codex subprocess calls.
# Equivalent env var: AF_LRM_TIMEOUT_SECONDS
# timeout_seconds = 20

# Suggested runtime commands:
#   GET  /config/lrm
#   POST /config/lrm
#   POST /config/lrm/test
